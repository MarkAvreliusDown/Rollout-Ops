{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Доска запуска ЦФ{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'board/style.css' %}">
</head>
<body>
  {% if messages %}
    <div class="flash">
      {% for message in messages %}<div class="flash-item">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
